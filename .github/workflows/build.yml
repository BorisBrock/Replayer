name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml to build the packages for a release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: 6.8.3
  # Shared LGPL build with MSVC import libraries, see build.ps1
  FFMPEG_ARCHIVE: ffmpeg-n8.1-latest-win64-lgpl-shared-8.1

jobs:
  windows:
    name: Windows
    # build.ps1 needs Visual Studio 2022, which matches the Qt binaries;
    # windows-latest comes with Visual Studio 2026.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$env:FFMPEG_ARCHIVE.zip"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath $env:RUNNER_TEMP
          "FFMPEG_DIR=$env:RUNNER_TEMP\$env:FFMPEG_ARCHIVE" >> $env:GITHUB_ENV

      - name: Build and package
        shell: pwsh
        run: ./build.ps1 -QtDir $env:QT_ROOT_DIR -FFmpegDir $env:FFMPEG_DIR

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux
    # The AppImage runs on distributions with this glibc version or newer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config file \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-randr0 libxcb-xkb1 \
            libxcb-xinerama0 libfontconfig1 libdbus-1-3

      # The same Qt as on Windows, instead of Ubuntu's older Qt 6.4
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true

      - name: Build and package
        env:
          CMAKE_GENERATOR: Ninja
          # The runner has no FUSE, so AppImage tools must unpack themselves
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: CMAKE_PREFIX_PATH="$QT_ROOT_DIR" ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error
