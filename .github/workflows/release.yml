name: Release

on:
  push:
    tags: ['v*.*.*']

# Read-only by default. Only the job that publishes the release can write.
permissions:
  contents: read

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag with VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match VERSION (${version})"
            exit 1
          fi

  build:
    needs: check-version
    uses: ./.github/workflows/build.yml

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Creating a release and uploading its files counts as writing repo
    # contents. The token is limited to this repo and this job.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          # 0.x versions and versions like 1.0.0-rc1 are pre-releases
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
