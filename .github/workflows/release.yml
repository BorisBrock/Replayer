name: Release

on:
  push:
    tags: ['v*.*.*']

# Read-only by default. Only the job that publishes the release can write.
permissions:
  contents: read

jobs:
  version:
    name: Get version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} isn't a version like v2.0.0 or v2.0.0-rc1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    # Creating a release and uploading its files counts as writing repo
    # contents. The token is limited to this repo and this job.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          # 0.x versions and versions like 1.0.0-rc1 are pre-releases
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
